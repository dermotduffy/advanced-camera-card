---
name: 'CI'

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node and Yarn
        uses: volta-cli/action@v5

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn run lint

      - name: Type-check
        run: yarn run typecheck

      - name: Check for dead exports
        run: yarn run prune

      - name: Check formatting
        run: yarn run format-check

  test:
    name: Test / Unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node and Yarn
        uses: volta-cli/action@v5

      - name: Install dependencies
        run: yarn install --immutable

      - name: Test & Coverage
        run: yarn run coverage

  browser-test:
    name: Test / Browser / ${{ matrix.name }}

    # Not yet a required check: the browser suite is new/potentially unstable.
    continue-on-error: true

    runs-on: ubuntu-latest

    strategy:
      # One browser failing does not invalidate the others.
      fail-fast: false
      matrix:
        # `name` is only how the browser is written for a human: it titles the
        # job, while `browser` is the name Playwright knows it by.
        include:
          - browser: chromium
            name: Chromium
          - browser: firefox
            name: Firefox
          - browser: webkit
            name: WebKit

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node and Yarn
        uses: volta-cli/action@v5

      - name: Install dependencies
        run: yarn install --immutable

      # A browser is several hundred megabytes: cache it keyed by project dependencies.
      - name: Cache the browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('yarn.lock') }}

      # Downloads nothing when the cache had it, but still installs the system
      # libraries the browser needs, which live outside the cached directory.
      - name: Install browser
        run: yarn playwright install --with-deps ${{ matrix.browser }}

      - name: Browser test
        run: yarn run test:browser
        env:
          VITEST_BROWSER: ${{ matrix.browser }}

      - name: Upload browser test failures
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: browser-test-failures-${{ matrix.browser }}
          path: .vitest/
          if-no-files-found: ignore

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node and Yarn
        uses: volta-cli/action@v5

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn run build

      - name: HACS build validation
        uses: 'hacs/action@22.5.0'
        with:
          category: 'plugin'

          # Don't attempt to load into HACS (as it loads the release, not the
          # build).
          ignore: 'hacs'

      - name: Upload javascript
        uses: actions/upload-artifact@v7
        with:
          name: advanced-camera-card
          path: dist/*.js

      # Uploaded unarchived so the self-contained treemap can be viewed directly
      # in the browser rather than downloaded and unzipped. The artifact is
      # named after the file, as `name` is ignored when `archive` is false.
      - name: Upload bundle visualization
        uses: actions/upload-artifact@v7
        with:
          path: visualizations/treemap.html
          archive: false
